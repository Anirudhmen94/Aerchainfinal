<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Aerchain RFx Crew{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    .err { background:#fef2f2; color:#991b1b; border:1px solid #fecaca; border-radius:0.5rem; padding:0.75rem; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:0.75rem; box-shadow:0 1px 2px rgb(0 0 0/0.04); padding:1.25rem; }
    .btn { display:inline-flex; align-items:center; gap:0.5rem; border-radius:0.5rem; background:#0f172a; color:#fff; padding:0.5rem 1rem; font-size:0.875rem; font-weight:500; }
    .btn:hover { background:#334155; }
    .btn:disabled { opacity:0.5; cursor:not-allowed; }
    .btn-sec { display:inline-flex; align-items:center; gap:0.5rem; border-radius:0.5rem; background:#fff; border:1px solid #cbd5e1; color:#1e293b; padding:0.5rem 1rem; font-size:0.875rem; font-weight:500; }
    .btn-sec:hover { background:#f8fafc; }
    .chip { display:inline-block; font-size:0.7rem; padding:0.125rem 0.5rem; border-radius:9999px; background:#f1f5f9; color:#334155; }
    .chip-ok { background:#dcfce7; color:#166534; }
    .chip-bad { background:#fee2e2; color:#991b1b; }
    .chip-warn { background:#fef3c7; color:#92400e; }
    .chip-info { background:#dbeafe; color:#1e40af; }
    .cell-ok { background:#ecfdf5; }
    .cell-converted { background:#eff6ff; }
    .cell-missing { background:#f8fafc; color:#94a3b8; }
    .cell-uncertain { background:#fffbeb; }
    .cell-uom_mismatch { background:#fff7ed; }
    .status-pill { display:inline-block; font-size:0.65rem; padding:0.05rem 0.35rem; border-radius:9999px; font-weight:600; text-transform:uppercase; letter-spacing:0.02em; }
    .status-ok { background:#bbf7d0; color:#14532d; }
    .status-converted { background:#bfdbfe; color:#1e3a8a; }
    .status-missing { background:#e2e8f0; color:#475569; }
    .status-uncertain { background:#fde68a; color:#92400e; }
    .status-uom_mismatch { background:#fdba74; color:#9a3412; }
    table.matrix td, table.matrix th { border:1px solid #e2e8f0; padding:0.35rem 0.5rem; font-size:0.75rem; }
    .tab-pill { display:inline-flex; align-items:center; gap:0.4rem; padding:0.4rem 0.85rem; border-radius:9999px; font-size:0.8rem; font-weight:500; border:1px solid transparent; }
    .tab-cur { background:#312e81; color:#fff; border-color:#312e81; }
    .tab-open { background:#fff; color:#334155; border-color:#cbd5e1; }
    .tab-open:hover { background:#f8fafc; border-color:#94a3b8; }
    .tab-done-dot { width:0.45rem; height:0.45rem; border-radius:9999px; background:#22c55e; display:inline-block; }
    .empty-hint { background:#fffbeb; border:1px solid #fde68a; color:#92400e; border-radius:0.75rem; padding:1rem; font-size:0.875rem; }

    .provisional-banner { background:#fffbeb; border:1px solid #f59e0b; color:#92400e; border-radius:0.75rem; padding:0.75rem 1rem; font-size:0.875rem; display:flex; gap:0.75rem; align-items:flex-start; }
    .provisional-banner strong { font-weight:600; }
    .shortlist-strip { display:flex; flex-wrap:wrap; gap:0.5rem; align-items:center; }
    .shortlist-card { border:1px solid #c7d2fe; background:#eef2ff; color:#312e81; border-radius:0.75rem; padding:0.5rem 0.75rem; font-size:0.75rem; min-width:8rem; }
    .shortlist-card .cov { font-variant-numeric:tabular-nums; color:#4338ca; font-weight:600; }
    .excluded-card { border:1px solid #fecaca; background:#fff1f2; color:#9f1239; border-radius:0.75rem; padding:0.4rem 0.65rem; font-size:0.7rem; }
    .price-cell { cursor:pointer; }
    .price-cell:hover { outline:2px solid #818cf8; outline-offset:-2px; }
    .evidence-backdrop { position:fixed; inset:0; background:rgba(15,23,42,0.35); z-index:40; }
    .ko-chart-wrap { position:relative; height:220px; max-width:100%; margin:0.75rem 0 1rem; }
    .q-pass { background:#ecfdf5; }
    .q-fail { background:#fef2f2; }
    .q-unanswered { background:#f8fafc; }
    .evidence-drawer { position:fixed; top:0; right:0; height:100%; width:min(28rem,100%); background:#fff; z-index:50; box-shadow:-8px 0 24px rgba(15,23,42,0.15); overflow:auto; padding:1.25rem; }
    .evidence-drawer h3 { font-size:1rem; font-weight:600; margin-bottom:0.25rem; }
    .evidence-meta { font-size:0.75rem; color:#64748b; margin-bottom:0.75rem; }
    .evidence-snippet { background:#f8fafc; border:1px solid #e2e8f0; border-radius:0.5rem; padding:0.5rem 0.75rem; font-size:0.75rem; margin-bottom:0.5rem; }
    .evidence-snippet .loc { color:#64748b; font-size:0.65rem; margin-top:0.25rem; }


    .q-pass { background:#ecfdf5; color:#14532d; }
    .q-fail { background:#fef2f2; color:#991b1b; }
    .q-unanswered { background:#f8fafc; color:#94a3b8; }
    .q-cell { font-size:0.7rem; text-align:center; vertical-align:top; min-width:6.5rem; }
    .q-cell .ans { display:block; margin-top:0.15rem; font-weight:500; max-width:9rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-left:auto; margin-right:auto; }
    .ko-badge { display:inline-block; font-size:0.6rem; padding:0.05rem 0.3rem; border-radius:9999px; background:#fee2e2; color:#991b1b; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; }

    @media print {
      .no-print { display:none !important; }
      body { background:#fff; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <header class="border-b border-slate-200 bg-white no-print">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="/" class="font-semibold tracking-tight">Aerchain <span class="text-indigo-600">RFx Crew</span></a>
      <nav class="text-sm text-slate-500">Free tabbed workspace</nav>
    </div>
  </header>
  <main class="max-w-6xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>
  <div id="evidence-root"></div>
</body>
</html>
