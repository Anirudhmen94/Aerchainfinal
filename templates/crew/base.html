<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Aerchain RFx Crew{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    .err { background:#fef2f2; color:#991b1b; border:1px solid #fecaca; border-radius:0.5rem; padding:0.75rem; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:0.75rem; box-shadow:0 1px 2px rgb(0 0 0/0.04); padding:1.25rem; }
    .btn { display:inline-flex; align-items:center; gap:0.5rem; border-radius:0.5rem; background:#0f172a; color:#fff; padding:0.5rem 1rem; font-size:0.875rem; font-weight:500; }
    .btn:hover { background:#334155; }
    .btn:disabled { opacity:0.5; cursor:not-allowed; }
    .btn-sec { display:inline-flex; align-items:center; gap:0.5rem; border-radius:0.5rem; background:#fff; border:1px solid #cbd5e1; color:#1e293b; padding:0.5rem 1rem; font-size:0.875rem; font-weight:500; }
    .btn-sec:hover { background:#f8fafc; }
    .chip { display:inline-block; font-size:0.7rem; padding:0.125rem 0.5rem; border-radius:9999px; background:#f1f5f9; color:#334155; }
    .chip-ok { background:#dcfce7; color:#166534; }
    .chip-bad { background:#fee2e2; color:#991b1b; }
    .chip-warn { background:#fef3c7; color:#92400e; }
    .chip-info { background:#dbeafe; color:#1e40af; }
    .cell-ok { background:#ecfdf5; }
    .cell-converted { background:#eff6ff; }
    .cell-missing { background:#f8fafc; color:#94a3b8; }
    .cell-uncertain { background:#fffbeb; }
    .cell-uom_mismatch { background:#fff7ed; }
    .status-pill { display:inline-block; font-size:0.65rem; padding:0.05rem 0.35rem; border-radius:9999px; font-weight:600; text-transform:uppercase; letter-spacing:0.02em; }
    .status-ok { background:#bbf7d0; color:#14532d; }
    .status-converted { background:#bfdbfe; color:#1e3a8a; }
    .status-missing { background:#e2e8f0; color:#475569; }
    .status-uncertain { background:#fde68a; color:#92400e; }
    .status-uom_mismatch { background:#fdba74; color:#9a3412; }
    table.matrix td, table.matrix th { border:1px solid #e2e8f0; padding:0.35rem 0.5rem; font-size:0.75rem; }
    .tab-pill { display:inline-flex; align-items:center; gap:0.4rem; padding:0.4rem 0.85rem; border-radius:9999px; font-size:0.8rem; font-weight:500; border:1px solid transparent; }
    .tab-cur { background:#312e81; color:#fff; border-color:#312e81; }
    .tab-open { background:#fff; color:#334155; border-color:#cbd5e1; }
    .tab-open:hover { background:#f8fafc; border-color:#94a3b8; }
    .tab-done-dot { width:0.45rem; height:0.45rem; border-radius:9999px; background:#22c55e; display:inline-block; }
    .empty-hint { background:#fffbeb; border:1px solid #fde68a; color:#92400e; border-radius:0.75rem; padding:1rem; font-size:0.875rem; }
    @media print {
      .no-print { display:none !important; }
      body { background:#fff; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <header class="border-b border-slate-200 bg-white no-print">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="/" class="font-semibold tracking-tight">Aerchain <span class="text-indigo-600">RFx Crew</span></a>
      <nav class="text-sm text-slate-500">Free tabbed workspace</nav>
    </div>
  </header>
  <main class="max-w-6xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
