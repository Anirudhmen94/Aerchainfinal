<div class="bg-white rounded-lg border border-slate-200 p-3">
  <div class="text-xs uppercase tracking-wide text-slate-500 mb-1">You</div>
  <p class="text-sm font-medium mb-2">{{ turn.question }}</p>
  <div class="text-xs uppercase tracking-wide text-indigo-600 mb-1">Analyst</div>
  <div class="text-sm whitespace-pre-wrap text-slate-800">{{ turn.answer }}</div>
  {% if turn.caveats %}
  <ul class="mt-2 text-xs text-amber-700 list-disc list-inside">
    {% for c in turn.caveats %}<li>{{ c }}</li>{% endfor %}
  </ul>
  {% endif %}
</div>
